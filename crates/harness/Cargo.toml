[package]
name = "atari-harness"
description = "Test harness for the Atari 65XE emulator: test data, helpers and system test suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atari-core.workspace = true
# The golden frame images (REQ-026).
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
# The capture logger of the machine event log tests (REQ-084).
log = { version = "0.4.35", default-features = false, features = ["kv"] }
# The media parser property tests (REQ-061).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
