name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Weekly run catches new RustSec advisories without any code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: "1"

# The toolchain comes from rust-toolchain.toml; `rustup toolchain install`
# with no arguments installs exactly that version and its components.
# Third-party actions are pinned to full commit SHAs; Dependabot updates them.
#
# The frontend (`atari-mac`, the root crate) runs on macOS only (docs/spec/README.md,
# "Non-goals"). Its window crate needs system libraries on Linux, so the jobs that build
# code on Linux use `--workspace --exclude atari-mac`, and the `frontend` job checks the
# frontend on macOS (docs/design/architecture.md, "CI targets"). cargo-deny and
# cargo-machete do not build code, so they still check the whole workspace.

jobs:
  fmt:
    name: Format (rustfmt, taplo) and spelling (typos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: taplo-cli,typos
      - run: cargo fmt --all --check
      - run: taplo fmt --check
      - run: taplo lint
      - run: typos

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --exclude atari-mac --all-targets --all-features --locked

  frontend:
    name: Frontend (macOS clippy, docs)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --package atari-mac --all-targets --all-features --locked
      - run: cargo doc --package atari-mac --no-deps --document-private-items --all-features --locked

  # The tests on macOS: the whole workspace with the frontend. On Linux, the job `coverage`
  # runs the same tests (with the coverage counters) except `media_fuzz`, so the
  # SingleStepTests suite runs once on each OS.
  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache ROMs and test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            roms/*.rom
            test-data
          key: test-data-${{ hashFiles('scripts/fetch-roms.sh', 'scripts/single-step-6502.sha1') }}
      - run: scripts/fetch-roms.sh --single-step
        shell: bash
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --locked
      - name: Release build (overflow checks on, LTO)
        run: cargo build --workspace --release --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --exclude atari-mac --no-deps --document-private-items --all-features --locked

  deny:
    name: Dependencies (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny --all-features --locked check
      - run: cargo machete

  hack:
    name: MSRV and feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo hack check --rust-version --workspace --exclude atari-mac --all-targets --locked
      - run: cargo hack check --feature-powerset --workspace --exclude atari-mac --all-targets --locked

  # The tests on Linux (the core and the harness), with the coverage counters: `cargo
  # llvm-cov nextest --all-targets` runs the same tests as `cargo test --all-targets`, but
  # the filter leaves out the property tests of the media parsers (`media_fuzz`, REQ-061).
  # With the coverage counters they take more than 25 minutes; the job `test` runs them.
  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Keep the cargo-nextest version in sync with `make tools`.
          tool: cargo-llvm-cov,cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache ROMs and test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            roms/*.rom
            test-data
          key: test-data-${{ hashFiles('scripts/fetch-roms.sh', 'scripts/single-step-6502.sha1') }}
      - run: scripts/fetch-roms.sh --single-step
        shell: bash
      # Keep the threshold in sync with COVERAGE_MIN and the filter in sync with COVERAGE_FILTER
      # in the Makefile.
      - run: cargo llvm-cov nextest --workspace --exclude atari-mac --all-targets --all-features --locked --fail-under-lines 80 -E 'not (package(atari-harness) & binary(=media_fuzz))'
      - name: Doc tests
        run: cargo test --workspace --exclude atari-mac --doc --all-features --locked
      - name: Release build (overflow checks on, LTO)
        run: cargo build --workspace --exclude atari-mac --release --locked

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: shellcheck,zizmor
      # install-action has no actionlint manifest, so download the pinned release.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint
      - run: zizmor --offline .github/workflows
      - run: shellcheck .githooks/pre-commit scripts/fetch-roms.sh scripts/worktree-setup.sh scripts/mutants.sh

  spec:
    name: Specification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The gates of docs/design/spec-gates.md. They write target/traceability.md (REQ-052).
      - run: make spec-check
      - name: Upload the traceability matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability
          path: target/traceability.md
          if-no-files-found: error
      - name: Counts and violations in the job summary
        if: always()
        run: |
          if [ -f target/traceability.md ]; then
            sed -n '/^## Counts/,$p' target/traceability.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "target/traceability.md was not written." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Mutation testing of the changed lines (REQ-060, docs/design/code-gates.md "Mutation
  # testing"). A push to main tests the diff of the push (`github.event.before` to
  # `github.sha`). The first push of a branch has no old commit (all zeros), so it tests the
  # diff of the last commit. A pull request or a merge queue entry tests the diff from its
  # base. A scheduled or manual run has no diff and passes. The frontend mutants run only in
  # `make check` on macOS. Keep the packages in sync with MUTANTS_PACKAGES in the Makefile.
  mutants:
    name: Mutants (cargo-mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so that the old commit of the push is in the clone.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Keep the version in sync with `make tools`.
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache ROMs and test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            roms/*.rom
            test-data
          key: test-data-${{ hashFiles('scripts/fetch-roms.sh', 'scripts/single-step-6502.sha1') }}
      - run: scripts/fetch-roms.sh --single-step
        shell: bash
      - name: Mutants of the changed lines
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "The push has no old commit: the diff of the last commit."
                base=$(git rev-parse --verify --quiet HEAD~1 || true)
              else
                base=$BEFORE
              fi
              ;;
            pull_request) base=$(git merge-base "$PR_BASE" HEAD) ;;
            merge_group) base=$QUEUE_BASE ;;
            *) base= ;;
          esac
          if [ -z "$base" ]; then
            echo "mutants: no diff to test for this run ($EVENT): pass"
            exit 0
          fi
          scripts/mutants.sh "$base" --package atari-core --package atari-harness
      - name: Upload the mutants results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: target/mutants/mutants.out
          if-no-files-found: ignore

  # Single required status check for branch protection.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, frontend, test, doc, deny, hack, coverage, workflows, spec, mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job finished with: $r"
              exit 1
            fi
          done
