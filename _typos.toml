# typos spell checker: https://github.com/crate-ci/typos
[files]
extend-exclude = [
    "target/",
    "Cargo.lock",
    "test-data/",
    "roms/*.rom",
    "*.sha1",
    "reference/",
    ".claude/",
]

[default]
# Hex byte values in the specification, for example `BA` in an SIO frame.
extend-ignore-re = ["`[0-9A-Fa-f]{2}`", "\\b[0-9A-F]{2}\\b"]

[default.extend-words]
# Crate names, for example flate2.
flate = "flate"
# Atari hardware register names.
# STRIG is the BASIC function and the OS shadow name of the triggers.
STRIG = "STRIG"
CONSOL = "CONSOL"
consol = "consol"
# The CPU flags text of the trace, for example `P=N.-B.IZ.` (REQ-086).
IZ = "IZ"
# 6502 mnemonics.
ANC = "ANC"
ANE = "ANE"
CPY = "CPY"
SHS = "SHS"
shs = "shs"
# Register families written with a placeholder, for example PnPF, GRAFPn, SIZEx.
Pn = "Pn"
SIZ = "SIZ"
# POKEY serial state names, for example ser_in_clk.
ser = "ser"
# Words copied exactly from the references (section titles and mnemonics in NMS and MCS6500-HW).
ASO = "ASO"
TEY = "TEY"
DBE = "DBE"
Akkumulator = "Akkumulator"
