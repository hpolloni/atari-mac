# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Check only the dependencies of the hosts that the project builds for: the macOS
# frontend and the Linux CI runners (see `docs/design/architecture.md`, "CI targets").
# Without this list, cargo-deny also checks the Redox and Windows dependencies of
# `minifb` (Redox brings `sdl2` with a second `bitflags` version).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Any advisory (vulnerability, unmaintained, unsound, yanked) fails the build.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Add more deliberately, with a reason.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The crates of this workspace are `publish = false` (license: MIT OR Apache-2.0).
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies inside the workspace have no version. This allows them only for crates
# with `publish = false`; registry wildcards are still denied.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
